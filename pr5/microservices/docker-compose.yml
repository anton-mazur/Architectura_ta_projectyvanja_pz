services:
  catalog:
    build: ./services/catalog
    networks: [ms-net]
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  users:
    build: ./services/users
    networks: [ms-net]
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  orders:
    build: ./services/orders
    networks: [ms-net]
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  gateway:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./gateway/nginx.conf:/etc/nginx/nginx.conf:ro"]
    networks: [ms-net]
    restart: on-failure:3
    depends_on:
      catalog: {condition: service_healthy}
      users: {condition: service_healthy}
      orders: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/catalog/items >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
networks:
  ms-net:
    name: ms-net
