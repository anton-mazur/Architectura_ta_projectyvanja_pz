services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment: {ZOOKEEPER_CLIENT_PORT: 2181, ZOOKEEPER_TICK_TIME: 2000}
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 10
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on: {zookeeper: {condition: service_healthy}}
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 12
  init-kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on: {kafka: {condition: service_healthy}}
    command: ["bash", "-c", "kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic orders.events --partitions 1 --replication-factor 1"]
  orders:
    build: ./services/orders
    ports: ["5002:5002"]
    environment: {KAFKA_BROKER: kafka:9092}
    depends_on: {init-kafka: {condition: service_completed_successfully}}
    restart: on-failure:5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  billing:
    build: ./services/billing
    environment: {KAFKA_BROKER: kafka:9092}
    depends_on: {init-kafka: {condition: service_completed_successfully}}
    restart: on-failure:5
  notifications:
    build: ./services/notifications
    environment: {KAFKA_BROKER: kafka:9092}
    depends_on: {init-kafka: {condition: service_completed_successfully}}
    restart: on-failure:5
