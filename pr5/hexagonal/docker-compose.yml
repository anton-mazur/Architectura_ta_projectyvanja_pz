services:
  api:
    build: .
    environment:
      PORT: 8081
      REPO_ADAPTER: ${REPO_ADAPTER:-db}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: orders
      DB_USER: orders
      DB_PASS: orders
      CSV_PATH: /data/orders.csv
    ports: ["8081:8081"]
    volumes: ["orders_csv:/data"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  db:
    image: postgres:16
    environment: {POSTGRES_DB: orders, POSTGRES_USER: orders, POSTGRES_PASSWORD: orders}
    volumes: ["./db-init.sql:/docker-entrypoint-initdb.d/001-orders.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  orders_csv:
